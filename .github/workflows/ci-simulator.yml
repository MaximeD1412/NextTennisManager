name: CI — Simulator

on:
  push:
    branches: [develop, main]
    paths:
      - "NextManagerTennis_Simulator/**"
      - "shared/proto/**"
      - "physics-core/**"
      - ".github/workflows/ci-simulator.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "NextManagerTennis_Simulator/**"
      - "shared/proto/**"
      - "physics-core/**"
      - ".github/workflows/ci-simulator.yml"

jobs:
  build-and-test:
    name: Build & Test (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build sidecar
        run: cargo build --bin sidecar

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"

      - name: Build & test
        run: ./gradlew :shared:proto:generateProto :simulator:build :simulator:test
