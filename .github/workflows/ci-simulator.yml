name: CI — Simulator

on:
  push:
    branches: [develop, main]
    paths:
      - "NextManagerTennis_Simulator/**"
      - "shared/proto/**"
      - ".github/workflows/ci-simulator.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "NextManagerTennis_Simulator/**"
      - "shared/proto/**"
      - ".github/workflows/ci-simulator.yml"

jobs:
  build-and-test:
    name: Build & Test (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Build & test
        run: ./gradlew :shared:proto:generateProto :simulator:build :simulator:test
