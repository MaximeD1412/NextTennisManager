name: CI — WebApp

on:
  push:
    branches: [develop, main]
    paths:
      - "NextManagerTennis_WebApp/**"
      - "shared/proto/**"
      - ".github/workflows/ci-webapp.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "NextManagerTennis_WebApp/**"
      - "shared/proto/**"
      - ".github/workflows/ci-webapp.yml"

jobs:
  backend:
    name: Build & Test — Backend (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"

      - name: Build & test
        run: ./gradlew :shared:proto:generateProto :webapp:backend:build :webapp:backend:test

  frontend:
    name: Build & Test — Frontend (Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: NextManagerTennis_WebApp/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: NextManagerTennis_WebApp/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate proto types
        run: npm run generate:proto

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "1"
