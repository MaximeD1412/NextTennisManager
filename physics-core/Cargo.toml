[package]
name = "physics-core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sidecar"
path = "src/bin/sidecar.rs"

[dependencies]
prost = "0.13"
rand = { version = "0.8", default-features = false, features = ["small_rng"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tonic = "0.12"

[build-dependencies]
prost-build = "0.13"
